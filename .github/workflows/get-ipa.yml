name: Скачать IPA

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: "Номер приложения (например, 6769745089)"
        required: true
        type: string
      auth_code:
        description: "Код 2FA (6 цифр). Первый раз оставьте пустым"
        required: false
        type: string
        default: ""

jobs:
  download:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Клонирование репозитория ipatool
        uses: actions/checkout@v4
        with:
          repository: 'majd/ipatool' # Автоматически скачиваем исходники утилиты

      - name: Настройка Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable' # Используем стабильную версию вместо отсутствующего файла

      - name: Сборка утилиты
        run: |
          go generate ./... || true
          CGO_ENABLED=1 go build -trimpath -o ipatool .

      - name: Подготовка связки ключей macOS
        run: |
          security create-keychain -p "" build.keychain || true
          security set-keychain-settings -t 3600 -u build.keychain || true
          security unlock-keychain -p "" build.keychain
          security list-keychains -d user -s build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain || true

      - name: Авторизация и загрузка IPA
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASS: ${{ secrets.APPLE_PASS }}
          APP_ID: ${{ github.event.inputs.app_id }}
          AUTH_CODE: ${{ github.event.inputs.auth_code }}
        run: |
          if [ -n "$AUTH_CODE" ]; then
            ./ipatool auth login --email "$APPLE_ID" --password "$APPLE_PASS" --auth-code "$AUTH_CODE"
          else
            ./ipatool auth login --email "$APPLE_ID" --password "$APPLE_PASS" || true
          fi
          
          # Проверяем статус авторизации перед загрузкой
          ./ipatool download --app-id "$APP_ID" --purchase --output "app-${APP_ID}.ipa"

      - name: Загрузка артефакта
        uses: actions/artifacts/upload-artifact@v4
        with:
          name: ipa-${{ github.event.inputs.app_id }}
          path: "app-${{ github.event.inputs.app_id }}.ipa"
          retention-days: 3
