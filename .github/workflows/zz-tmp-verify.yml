# TEMPORARY verification workflow — deleted right after the build check.
name: Temporary verification

on:
  push:
    branches: [arena/01a06a22-ipatool-sapfix-webgui]

jobs:
  build:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l cmd pkg)
          if [ -n "$out" ]; then
            echo "::error::unformatted files: $out"
            exit 1
          fi
      - run: go generate ./...
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  lint:
    name: golangci-lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true
      - run: go generate github.com/majd/ipatool/...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.9
