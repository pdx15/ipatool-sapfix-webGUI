# TEMPORARY verification workflow — deleted right after the build check.
name: Temporary verification

on:
  push:
    branches: [arena/01a06a22-ipatool-sapfix-webgui]

jobs:
  verify:
    name: Verify ${{ matrix.label }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: branch
            ref: arena/01a06a22-ipatool-sapfix-webgui
          - label: main
            ref: main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt report
        run: gofmt -l cmd pkg || true

      - run: go generate ./...

      - name: build
        run: go build ./... 2>&1 | tee /tmp/build.log

      - name: vet
        run: go vet ./... 2>&1 | tee /tmp/vet.log

      - name: test
        run: go test ./... 2>&1 | tee /tmp/test.log

      - name: Report
        if: always()
        run: |
          {
            echo "### ${{ matrix.label }}"
            echo
            echo '#### gofmt'
            echo '```'
            gofmt -l cmd pkg || true
            echo '```'
            echo
            echo '#### go test (last 120 lines)'
            echo '```'
            tail -n 120 /tmp/test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish log into the repo
        if: always()
        run: |
          mkdir -p tmp-ci
          {
            echo "label=${{ matrix.label }} run=${GITHUB_RUN_ID}"
            echo "--- gofmt ---"
            gofmt -l cmd pkg || true
            echo "--- go test ---"
            cat /tmp/test.log
          } > "tmp-ci/test-${{ matrix.label }}.txt"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add tmp-ci
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "ci: test log ${GITHUB_RUN_ID} ${{ matrix.label }} [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
