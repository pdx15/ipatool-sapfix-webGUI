version: "2"
linters:
  enable:
    - ginkgolinter
    - godot
    - godox
    - importas
    - nlreturn
    - nonamedreturns
    - prealloc
    - predeclared
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - wrapcheck
    - wsl
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # nlreturn misreads cgo-expanded call expressions (e.g. C.free and
      # C.ipatool_mescal_sign) as return statements and reports false
      # positives that cannot be fixed from the source.
      # See https://github.com/ssgreg/nlreturn/issues/4.
      - path: pkg/mescal/signer_darwin\.go
        linters:
          - nlreturn
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
